<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration — The Spotlight Comedy Academy</title>
  <meta name="description" content="Register as a new student at The Spotlight Comedy Academy. Enroll in 8-week comedy conservatory cohorts and take the stage.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css" id="rtl-stylesheet" disabled>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">
  <!-- WCAG Skip Link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Top Right Utility Actions (Outside Box) -->
  <div class="auth-top-actions">
    <button class="utility-btn theme-toggle-btn" aria-label="Toggle Dark/Light Mode">
      <span class="theme-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </span>
    </button>
    <button class="utility-btn rtl-toggle-btn" aria-label="Toggle RTL layout">
      <span style="font-weight: 700; font-size: 0.8rem;">RTL</span>
    </button>
  </div>

  <main id="main-content" class="auth-main" style="flex: 1; display: flex; align-items: center; justify-content: center; position: relative; padding: var(--sp-6) var(--sp-3); overflow: hidden;">
    <!-- 3D Stage Animated Canvas -->
    <div class="stage-canvas-container" aria-hidden="true">
      <canvas class="stage-canvas"></canvas>
    </div>

    <div class="curtain-drape-left" aria-hidden="true"></div>
    <div class="curtain-drape-right" aria-hidden="true"></div>

    <!-- Centered Registration Card -->
    <div class="container auth-container" style="max-width: 540px; position: relative; z-index: 10;">
      <div class="theatre-card dark-style auth-card-container" style="border: 2px solid var(--spotlight-gold); padding: var(--sp-5); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);">
        <!-- Brand Logo & Name -->
        <a href="index.html" class="auth-card-logo" aria-label="The Spotlight Comedy Academy Home" style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; margin-bottom: 20px;">
          <div class="logo-badge" style="width: 52px; height: 52px; background: var(--curtain-crimson); border: 2px solid var(--spotlight-gold); border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(245, 183, 0, 0.35); margin-bottom: 10px;">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color: #ffffff;"><path d="M3 8a4 4 0 0 1 4-4h1a4 4 0 0 1 4 4v3a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5V8z"/><circle cx="6" cy="9" r="1" fill="currentColor"/><circle cx="9" cy="9" r="1" fill="currentColor"/><path d="M5.5 12.5a2.5 2.5 0 0 0 4 0"/><path d="M12 6.5a3.5 3.5 0 0 1 3.5-3.5h1A3.5 3.5 0 0 1 20 6.5v3a4.5 4.5 0 0 1-4.5 4.5"/><circle cx="15.2" cy="8.2" r="0.8" fill="currentColor"/><circle cx="18.2" cy="8.2" r="0.8" fill="currentColor"/><path d="M15.2 12a2 2 0 0 1 3 0"/></svg>
          </div>
          <div class="logo-text" style="text-align: center;">
            <span class="logo-title" style="display: block; font-family: var(--font-display); font-size: 1.5rem; letter-spacing: 0.05em; color: #ffffff; line-height: 1.1;">THE SPOTLIGHT</span>
            <span class="logo-sub" style="display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.16em; color: var(--spotlight-gold); margin-top: 4px;">Comedy Academy</span>
          </div>
        </a>

        <h1 style="font-size: 1.8rem; margin: 8px 0; color: #fff;">JOIN THE CONSERVATORY</h1>
        <p class="card-description" style="margin-bottom: 24px;">Create your student account to enroll in comedy cohorts, track course progression, and take the stage.</p>

        <form id="studentRegisterForm" novalidate style="width: 100%;">
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="regFirstName">First Name *</label>
              <input type="text" id="regFirstName" class="form-control" placeholder="e.g., Alex" value="Alex" required>
              <div class="form-error"></div>
            </div>

            <div class="form-group">
              <label class="form-label" for="regLastName">Last Name *</label>
              <input type="text" id="regLastName" class="form-control" placeholder="e.g., Rivera" value="Rivera" required>
              <div class="form-error"></div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="regEmail">Email Address *</label>
            <input type="email" id="regEmail" class="form-control" placeholder="alex.rivera@example.com" value="alex.rivera@example.com" required>
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="regTrack">Preferred Initial Track</label>
            <select id="regTrack" class="form-control">
              <option value="level1">Level 1: Foundations of Improv ($295)</option>
              <option value="level2">Level 2: Scene Work & Characters ($325)</option>
              <option value="sketch">Sketch Comedy Writing Lab ($345)</option>
              <option value="musical">Musical Improv Intensive ($310)</option>
            </select>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="regPassword">Password *</label>
              <input type="password" id="regPassword" class="form-control" value="comedyLover2026" required>
              <div class="form-error"></div>
            </div>

            <div class="form-group">
              <label class="form-label" for="regConfirmPassword">Confirm Password *</label>
              <input type="password" id="regConfirmPassword" class="form-control" value="comedyLover2026" required>
              <div class="form-error"></div>
            </div>
          </div>

          <div style="display: flex; align-items: flex-start; gap: 8px; margin-bottom: 20px; text-align: left;">
            <input type="checkbox" id="agreeTerms" checked style="accent-color: var(--spotlight-gold); width: 18px; height: 18px; margin-top: 2px;">
            <label for="agreeTerms" style="font-size: 0.83rem; color: var(--marquee-cream-muted); line-height: 1.4;">
              I agree to The Spotlight <a href="#" onclick="return false;" style="color: var(--spotlight-gold);">Ensemble Code of Conduct</a> and safety guidelines.
            </label>
          </div>

          <div style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
            <button type="submit" class="btn btn-gold" style="width: 100%;">Create Student Account & Enroll</button>

            <!-- OR Divider -->
            <div class="auth-divider">
              <span>OR</span>
            </div>

            <!-- Social Authentication Buttons -->
            <div class="social-auth-grid">
              <button type="button" class="btn-social-auth google-auth-btn" id="googleRegisterBtn">
                <svg width="18" height="18" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Google</span>
              </button>

              <button type="button" class="btn-social-auth apple-auth-btn" id="appleRegisterBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.67-.82 1.13-1.96.99-3.12-1 .04-2.22.67-2.92 1.49-.63.73-1.18 1.9-1.03 3.03 1.12.09 2.28-.58 2.96-1.4"/>
                </svg>
                <span>Apple</span>
              </button>
            </div>

            <button type="button" id="demoRegisterBtn" class="btn btn-primary" style="width: 100%; margin-top: 4px;">Demo 1-Click Instant Registration</button>
          </div>
        </form>

        <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.1); width: 100%; text-align: center;">
          <p style="font-size: 0.9rem; color: var(--marquee-cream-muted);">
            Already have an account? <a href="login.html" style="color: var(--spotlight-gold); font-weight: 600;">Log In to Portal</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="../assets/js/tilt-cards.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const registerForm = document.getElementById('studentRegisterForm');
      const demoBtn = document.getElementById('demoRegisterBtn');
      const googleBtn = document.getElementById('googleRegisterBtn');
      const appleBtn = document.getElementById('appleRegisterBtn');

      function executeRegistration(customName) {
        const firstName = document.getElementById('regFirstName')?.value || 'Alex';
        const lastName = document.getElementById('regLastName')?.value || 'Rivera';
        const fullName = customName || `${firstName} ${lastName}`.trim();
        
        window.theatreAuth.login(fullName);
        window.theatreAuth.toast(`Welcome to The Spotlight! Account active.`);
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 500);
      }

      if (registerForm) {
        registerForm.addEventListener('submit', (e) => {
          e.preventDefault();
          executeRegistration();
        });
      }

      if (demoBtn) {
        demoBtn.addEventListener('click', () => {
          executeRegistration();
        });
      }

      if (googleBtn) {
        googleBtn.addEventListener('click', () => {
          window.theatreAuth.toast('Registering via Google account...');
          executeRegistration('Alex Rivera (Google)');
        });
      }

      if (appleBtn) {
        appleBtn.addEventListener('click', () => {
          window.theatreAuth.toast('Registering via Apple ID...');
          executeRegistration('Alex Rivera (Apple)');
        });
      }
    });
  </script>
</body>
</html>
